name: Update Day Counter

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate days and update README
        run: |
          # ⚠️ SET YOUR START DATE HERE (YYYY-MM-DD)
          START_DATE="2023-01-01" 
          
          TODAY=$(date +%Y-%m-%d)
          # Calculate difference in days, +1 to count the start day as Day 1
          DAYS=$(( ( $(date -d "$TODAY" +%s) - $(date -d "$START_DATE" +%s) ) / 86400 + 1 ))

          # Use sed to replace the marker in README.md with the new text
          sed -i "s|<!-- DAY_COUNTER -->.*<!-- END_DAY_COUNTER -->|<!-- DAY_COUNTER -->Day **$DAYS** of asking Github to unsuspend my account @ibrahist<!-- END_DAY_COUNTER -->|" README.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "No changes to commit" || (
            git add README.md &&
            git commit -m "Update day counter to day ${{ steps.calc.outputs.days }}"
          )
          git push
